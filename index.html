<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Sales Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #198754;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 5px;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #666;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
            color: #198754;
        }

        .section {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .section h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            background: #198754;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #146c43;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #198754;
            color: white;
        }

        .sell-btn {
            background: #0d6efd;
            padding: 8px 14px;
        }

        .sell-btn:hover {
            background: #0b5ed7;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Product Sales Management</h1>
    <p>Manage Products, Sales and Stock</p>
</header>

<div class="container">

    <!-- Dashboard -->
    <div class="cards">

        <div class="card">
            <h3>Total Products</h3>
            <p id="totalProducts">0</p>
        </div>

        <div class="card">
            <h3>Total Sales</h3>
            <p>৳ <span id="totalSales">0</span></p>
        </div>

        <div class="card">
            <h3>Total Stock</h3>
            <p id="totalStock">0</p>
        </div>

    </div>


    <!-- Add Product -->
    <div class="section">

        <h2>Add Product</h2>

        <div class="form-grid">

            <input
                type="text"
                id="productName"
                placeholder="Product Name"
            >

            <input
                type="text"
                id="productCode"
                placeholder="Product Code"
            >

            <input
                type="number"
                id="purchasePrice"
                placeholder="Purchase Price"
            >

            <input
                type="number"
                id="sellingPrice"
                placeholder="Selling Price"
            >

            <input
                type="number"
                id="stock"
                placeholder="Stock Quantity"
            >

        </div>

        <br>

        <button onclick="addProduct()">
            Add Product
        </button>

    </div>


    <!-- Product List -->
    <div class="section">

        <h2>Product List</h2>

        <table>

            <thead>
                <tr>
                    <th>Product</th>
                    <th>Code</th>
                    <th>Purchase Price</th>
                    <th>Selling Price</th>
                    <th>Stock</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="productTable">
            </tbody>

        </table>

    </div>


    <!-- Sales -->
    <div class="section">

        <h2>Make a Sale</h2>

        <div class="form-grid">

            <input
                type="text"
                id="customerName"
                placeholder="Customer Name"
            >

            <select id="saleProduct">
                <option value="">Select Product</option>
            </select>

            <input
                type="number"
                id="saleQuantity"
                placeholder="Quantity"
                min="1"
            >

        </div>

        <br>

        <button onclick="makeSale()">
            Make Sale
        </button>

    </div>


    <!-- Sales Report -->
    <div class="section">

        <h2>Sales Report</h2>

        <table>

            <thead>
                <tr>
                    <th>Date</th>
                    <th>Customer</th>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Total</th>
                </tr>
            </thead>

            <tbody id="salesTable">
            </tbody>

        </table>

    </div>

</div>


<script>

    let products = [];
    let sales = [];

    function addProduct() {

        const name = document.getElementById("productName").value;
        const code = document.getElementById("productCode").value;
        const purchase = Number(document.getElementById("purchasePrice").value);
        const selling = Number(document.getElementById("sellingPrice").value);
        const stock = Number(document.getElementById("stock").value);

        if (!name || !code || !purchase || !selling || !stock) {
            alert("Please fill all product information.");
            return;
        }

        const product = {
            id: Date.now(),
            name: name,
            code: code,
            purchase: purchase,
            selling: selling,
            stock: stock
        };

        products.push(product);

        document.getElementById("productName").value = "";
        document.getElementById("productCode").value = "";
        document.getElementById("purchasePrice").value = "";
        document.getElementById("sellingPrice").value = "";
        document.getElementById("stock").value = "";

        updateDashboard();
        displayProducts();
        updateProductSelect();
    }


    function displayProducts() {

        const table = document.getElementById("productTable");

        table.innerHTML = "";

        products.forEach(product => {

            const row = `
                <tr>
                    <td>${product.name}</td>
                    <td>${product.code}</td>
                    <td>৳ ${product.purchase}</td>
                    <td>৳ ${product.selling}</td>
                    <td>${product.stock}</td>
                    <td>
                        <button
                            class="sell-btn"
                            onclick="selectProduct(${product.id})">
                            Sell
                        </button>
                    </td>
                </tr>
            `;

            table.innerHTML += row;
        });
    }


    function updateProductSelect() {

        const select = document.getElementById("saleProduct");

        select.innerHTML =
            '<option value="">Select Product</option>';

        products.forEach(product => {

            const option = document.createElement("option");

            option.value = product.id;

            option.textContent =
                product.name + " - ৳" + product.selling;

            select.appendChild(option);
        });
    }


    function selectProduct(id) {

        document.getElementById("saleProduct").value = id;

        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
        });
    }


    function makeSale() {

        const customer =
            document.getElementById("customerName").value;

        const productId =
            Number(document.getElementById("saleProduct").value);

        const quantity =
            Number(document.getElementById("saleQuantity").value);

        if (!customer || !productId || !quantity) {
            alert("Please fill all sales information.");
            return;
        }

        const product =
            products.find(p => p.id === productId);

        if (!product) {
            alert("Product not found.");
            return;
        }

        if (quantity > product.stock) {
            alert("Not enough stock.");
            return;
        }

        const total = product.selling * quantity;

        product.stock -= quantity;

        const sale = {
            date: new Date().toLocaleDateString(),
            customer: customer,
            product: product.name,
            quantity: quantity,
            total: total
        };

        sales.push(sale);

        document.getElementById("customerName").value = "";
        document.getElementById("saleProduct").value = "";
        document.getElementById("saleQuantity").value = "";

        displaySales();
        displayProducts();
        updateDashboard();
    }


    function displaySales() {

        const table =
            document.getElementById("salesTable");

        table.innerHTML = "";

        sales.forEach(sale => {

            const row = `
                <tr>
                    <td>${sale.date}</td>
                    <td>${sale.customer}</td>
                    <td>${sale.product}</td>
                    <td>${sale.quantity}</td>
                    <td>৳ ${sale.total}</td>
                </tr>
            `;

            table.innerHTML += row;
        });
    }


    function updateDashboard() {

        document.getElementById("totalProducts").textContent =
            products.length;

        const totalSales =
            sales.reduce((sum, sale) => sum + sale.total, 0);

        document.getElementById("totalSales").textContent =
            totalSales;

        const totalStock =
            products.reduce((sum, product) => sum + product.stock, 0);

        document.getElementById("totalStock").textContent =
            totalStock;
    }

</script>

</body>
</html>
